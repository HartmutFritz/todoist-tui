name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  nix:
    name: Nix (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate all supported systems
        run: nix flake check --no-build --all-systems
      - name: Build, test, and exercise the installed application
        run: nix flake check --print-build-logs

  msrv:
    name: Rust 1.88 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check all targets with locked dependencies
        run: cargo check --locked --all-targets --all-features

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Neovim
        run: sudo apt-get update && sudo apt-get install --yes neovim
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build release binary
        run: cargo build --locked --release
